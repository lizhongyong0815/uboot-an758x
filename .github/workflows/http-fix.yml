name: Apply HTTP 100MB upload fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Patch and commit
        run: |
          set -euo pipefail
          f=lib/lwip/lwip/src/apps/http/httpd.c
          grep -q '#define HTTP_HDR_CONTENT_LEN_DIGIT_MAX_LEN  10' "$f"
          sed -i 's/^#define HTTP_HDR_CONTENT_LEN_DIGIT_MAX_LEN  10$/#define HTTP_HDR_CONTENT_LEN_DIGIT_MAX_LEN  16/' "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "httpd: fix POST uploads >= 100MB [skip ci]"
          git push
